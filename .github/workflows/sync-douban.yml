name: Sync Douban Library

on:
  # 手动触发
  workflow_dispatch:

  # 定时执行：每周一凌晨 2:00 UTC（北京时间周一 10:00）
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

# 防止定时任务和手动任务同时更新同一份豆瓣原始数据
concurrency:
  group: sync-douban
  cancel-in-progress: false

env:
  # 默认豆瓣用户 ID（也可通过仓库 Variables 覆盖）
  DEFAULT_DOUBAN_ID: '111296951'

jobs:
  sync:
    name: Sync Douban Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 豆瓣用户 ID 已配置在上方 env.DEFAULT_DOUBAN_ID
      # 也可通过仓库 Settings → Variables → DOUBAN_USER_ID 覆盖

      - name: Resolve Douban User ID
        id: douban-id
        run: |
          # 优先使用仓库变量，否则用默认值
          DOUBAN_ID="${{ vars.DOUBAN_USER_ID || env.DEFAULT_DOUBAN_ID }}"
          if [ -z "$DOUBAN_ID" ]; then
            echo "⚠️  未配置豆瓣用户 ID，跳过同步"
            exit 1
          fi
          echo "id=$DOUBAN_ID" >> $GITHUB_OUTPUT
          echo "✓ 使用豆瓣用户 ID: $DOUBAN_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare incremental sync cursors
        run: node scripts/prepare-doumark-json.mjs

      - name: Sync Douban watched movies
        uses: lizheming/doumark-action@master
        with:
          id: ${{ steps.douban-id.outputs.id }}
          type: movie
          status: done
          format: json
          dir: ./data/raw/douban
          # cookie 可选，用于访问私密内容
          # cookie: ${{ secrets.DOUBAN_COOKIE }}

      - name: Sync Douban read books
        uses: lizheming/doumark-action@master
        with:
          id: ${{ steps.douban-id.outputs.id }}
          type: book
          status: done
          format: json
          dir: ./data/raw/douban

      - name: Persist incremental sync cursors
        run: node scripts/prepare-doumark-json.mjs

      - name: Install dependencies
        run: npm ci

      - name: Normalize data
        run: npm run data:normalize
        env:
          # 可选：启用需要凭据的海报备用源；TVmaze 无需密钥
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          FANART_CLIENT_KEY: ${{ secrets.FANART_CLIENT_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Validate data
        run: npm run data:validate

      - name: Check for changes
        id: check-changes
        run: |
          if [ -z "$(git status --porcelain -- data/raw/douban/ public/posters/movies/)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 豆瓣原始数据和海报缓存均无变化，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📬 豆瓣原始数据或海报缓存有变化，准备提交"
            git status --short -- data/raw/douban/ public/posters/movies/
            git diff --stat -- data/raw/douban/ public/posters/movies/
          fi

      - name: Commit updated data
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw/douban/ public/posters/movies/
          git commit -m "chore(data): sync Douban movies and books

          Auto-synced by doumark-action
          Run ID: ${{ github.run_id }}"

          # 同步运行期间如果有人提交了笔记，将同步提交变基到最新分支后重试推送。
          # generated/ 不入库、manual/ 不由机器人修改；海报缓存按 ID 独立存放。
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "❌ 无法自动变基到 origin/${GITHUB_REF_NAME}，请检查原始数据冲突"
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "⚠️ 推送期间远端再次更新，准备第 $((attempt + 1)) 次尝试"
            fi
          done

          echo "❌ 连续 3 次推送失败"
          exit 1
